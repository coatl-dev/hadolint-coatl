name: ci

on:
  pull_request:
  push:
    branches:
      - coatl

jobs:
  tests:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - run: |
          python -m pip install tox

      - name: Cache tox
        uses: actions/cache@v6
        with:
          path: .tox
          key: tox-${{ steps.setup-python.outputs.python-version }}-${{ runner.os }}-${{ hashFiles('tox.ini') }}

      - name: Run tox
        run: |
          tox

      - name: Set up QEMU
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build wheels
        if: github.event_name == 'pull_request'
        uses: pypa/cibuildwheel@v4.2.0
